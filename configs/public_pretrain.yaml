state:
  output_state: M_R0

paths:
  rawdata_dir: data/rawdata
  target_fasta: data/target/target.fa
  processed_dir: outputs/processed
  teacher_score_dir: outputs/teacher_scores
  checkpoint_dir: outputs/checkpoints/M_R0

sequence_filter:
  allowed_aas: ACDEFGHIKLMNPQRSTVWY
  min_length: 10
  max_length: 50

split:
  cluster_identity: 0.90
  train: 0.80
  validation: 0.10
  test: 0.10
  split_unit: cluster

features:
  use_esm3: true
  use_physicochemical: true
  esm3_batch_size: 8
  esm3_public_embeddings: outputs/esm3_embeddings/public_peptides.npz
  esm3_target_embeddings: outputs/esm3_embeddings/targets.npz

teachers:
  pore_forming:
    enabled: true
    score_type: probability
  tpeppro:
    enabled: true
    cache_pair_scores: true

gated_integrator:
  tau: 0.5
  gamma: 10.0
  lambda_syn: 0.3

training:
  amp_prior:
    epochs: 200
    batch_size: 32
    learning_rate: 0.0001
    ensemble_seeds: [11, 23, 37, 51, 73]
    objective: nnPU_plus_manifold
    positive_to_unlabelled_ratio: 1.0
    positive_prior: REQUIRED_FROM_FROZEN_EXPERIMENT_CONFIG
    manifold_loss_weight: REQUIRED_FROM_FROZEN_EXPERIMENT_CONFIG
    branch_weight: REQUIRED_FROM_FROZEN_EXPERIMENT_CONFIG
  membrane_expert:
    epochs: 200
    batch_size: 32
    learning_rate: 0.0001
    teacher_loss_weight: 1.0
    ensemble_seeds: [11, 23, 37, 51, 73]
    missing_auxiliary_labels: masked
  target_affinity_expert:
    epochs: 200
    batch_size: 32
    learning_rate: 0.00005
    teacher_loss_weight: 1.0
    ensemble_seeds: [11, 23, 37, 51, 73]
    projection_dim: 256
    bilinear_rank: 64
    positive_to_background_ratio: 1.0
    aggregation_top_k: 5
    attention_noisy_or_coefficient: REQUIRED_FROM_FROZEN_EXPERIMENT_CONFIG
