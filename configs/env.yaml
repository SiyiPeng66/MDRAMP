project:
  name: MDRAMP_closed_loop
  root: .

runtime:
  seed: 20260608
  device: cuda
  num_workers: 4

esm3:
  required: true
  model_name: esm3-sm-open-v1
  installation: "pip install esm@git+https://github.com/Biohub/esm.git@main"
  freeze_encoder: true
  hf_home: outputs/hf_cache
  embedding_cache_dir: outputs/esm3_embeddings
  peptide_outputs:
    public: outputs/esm3_embeddings/public_peptides.npz
    private_R0: outputs/esm3_embeddings/private_R0_peptides.npz
  target_outputs:
    targets: outputs/esm3_embeddings/targets.npz

external_models:
  pore_forming:
    required: true
    root: otherModels/Pore-Forming
    model_path: otherModels/Pore-Forming/model.pkl
    prot_bert_dir: otherModels/Pore-Forming/prot_bert_bfd
  tpeppro:
    required: true
    root: otherModels/TPepPro
    run_mode: subprocess
