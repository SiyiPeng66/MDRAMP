[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdramp"
version = "0.3.0"
description = "V6 antimicrobial peptide discovery workflow"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "torch", "scikit-learn", "biopython", "pyyaml", "openpyxl>=3.1.5"]

[project.optional-dependencies]
test = ["pytest"]
teachers = ["transformers==4.48.1", "sentencepiece==0.2.1"]
esm = ["esm==3.2.1.post1", "httpx", "scikit-learn==1.7.2"]

[tool.setuptools.packages.find]
include = ["src*", "mdramp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
mdramp = "mdramp.cli:main"
mdramp-workflow = "src.workflow.run:main"
mdramp-generate = "src.generation.cli:main"
mdramp-score = "src.score.score_candidates:main"
mdramp-train-mic = "src.train.train_mic_head:main"
