state:
  output_state: M_R0

paths:
  rawdata_dir: data/rawdata
  target_fasta: data/target/target.fa
  processed_dir: outputs/processed
  teacher_score_dir: outputs/teacher_scores
  checkpoint_dir: outputs/checkpoints/M_R0

sequence_filter:
  allowed_aas: ACDEFGHIKLMNPQRSTVWY
  min_length: 10
  max_length: 50

split:
  cluster_identity: 0.90
  train: 0.80
  validation: 0.10
  test: 0.10
  split_unit: cluster

features:
  use_esm3: true
  use_physicochemical: true
  esm3_batch_size: 8
  esm3_public_embeddings: outputs/esm3_embeddings/public_peptides.npz
  esm3_target_embeddings: outputs/esm3_embeddings/targets.npz

teachers:
  pore_forming:
    enabled: true
    score_type: probability
  tpeppro:
    enabled: true
    cache_pair_scores: true

gated_integrator:
  tau: 0.5
  gamma: 10.0
  lambda_syn: 0.3

training:
  amp_prior:
    epochs: 50
    batch_size: 64
    learning_rate: 0.0001
  membrane_expert:
    epochs: 50
    batch_size: 64
    learning_rate: 0.0001
    teacher_loss_weight: 1.0
  target_affinity_expert:
    epochs: 30
    batch_size: 32
    learning_rate: 0.00005
    teacher_loss_weight: 1.0
